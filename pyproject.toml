[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
# Mango Tuya Local is fetched into custom_components/ only for the tests: keep the import order
# the same whether or not it is present (CI lints before fetching it)
known-first-party = ["custom_components"]
