type: vertical-stack
cards:
  # --- Tila, diagnoosi ja avainluvut -------------------------------------------------------
  - type: markdown
    card_mod:
      style: |
        ha-card { font-family: "Roboto Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; }
    content: |
      {%- set st = 'sensor.cop_tekoaly_tilanne' -%}
      {%- set dg = 'sensor.cop_tekoaly_diagnoosi' -%}
      {%- set c = 'sensor.cop_tekoaly_cop' -%}
      {%- set n = 'sensor.cop_tekoaly_naennainen_hyotysuhde' -%}
      {%- set eta = states(n) | float(none) -%}
      {%- set dry = state_attr(n, 'kuivan_imun_taso_pros') | float(70) -%}
      {%- set wet = state_attr(n, 'märkäraja_pros') | float(85) -%}
      {%- macro f(v, d=2, u='') -%}{{ '–' if v is none or v == '' else (((v | float(0)) | round(d)) | string | replace('.', ',')) ~ u }}{%- endmacro -%}
      {%- set code = state_attr(dg, 'koodi') -%}
      ## <ha-icon icon="mdi:robot-outline"></ha-icon> COP-tekoäly · {{ states('select.cop_tekoaly_tila') }}
      **{{ states(st) }}**

      {% if code in ['vika', 'vastus', 'marka_imu', 'marka_imu_minimi', 'ei_dataa'] -%}
      <ha-alert alert-type="warning">{{ states(dg) }}</ha-alert>
      {%- elif code in ['ok'] -%}
      <ha-alert alert-type="success">{{ states(dg) }}</ha-alert>
      {%- else -%}
      <ha-alert alert-type="info">{{ states(dg) }}</ha-alert>
      {%- endif %}

      | tunti | kylmäpiiri | vesipuoli |
      |:--|--:|--:|
      | COP | {{ f(state_attr(c, 'cop_kylmäpiiri')) }} | {{ f(state_attr(c, 'cop_vesipuoli')) }} |
      | laatuaste | {{ f(state_attr(c, 'laatuaste_kylmäpiiri'), 3) }} | {{ f(state_attr(c, 'laatuaste_vesipuoli'), 3) }} |
      | poikkeama | {{ f(state_attr(c, 'poikkeama_kylmäpiiri_pros'), 1, ' %') }} | {{ f(state_attr(c, 'poikkeama_vesipuoli_pros'), 1, ' %') }} |

      Carnot {{ f(state_attr(c, 'carnot_cop')) }} · odotettu {{ f(state_attr(c, 'odotettu_cop')) }} · luokka `{{ state_attr(c, 'vertailuluokka') or '–' }}` · {{ state_attr(c, 'tasaisia_minuutteja') or 0 }} tasaista min

      {% set tag = '–' if eta is none else ('<font color="#e5534b">MÄRKÄ</font>' if eta >= wet else ('<font color="#d29922">RAJALLA</font>' if eta >= dry + 7 else '<font color="#3fb950">KUIVA</font>')) -%}
      Imu {{ tag }} · näennäinen η {{ f(eta, 1, ' %') }} · kuiva {{ f(dry, 1) }} · märkä ≥ {{ f(wet, 1) }}
      Kirjoitukset {{ state_attr(st, 'kirjoituksia_24h') or 0 }}/{{ state_attr(st, 'kirjoitusraja_vrk') or 12 }} vrk · yht. {{ state_attr(st, 'kirjoituksia_yhteensä') or 0 }} · Mango {{ state_attr(st, 'mango_parametrit_saatavilla') or 0 }}/{{ state_attr(st, 'mango_parametrit_löytyi') or 0 }}
      {%- set miss = state_attr(st, 'puuttuvat_entiteetit') or [] %}
      {%- if miss %}
      Puuttuu: {{ miss | join(', ') }}
      {%- endif %}
      {%- if state_attr(st, 'tauko_asti') %}
      Tauko {{ as_timestamp(state_attr(st, 'tauko_asti')) | timestamp_custom('%d.%m. %H:%M') }} asti
      {%- endif %}

  # --- Ohjaus ---------------------------------------------------------------------------------
  - type: entities
    entities:
      - entity: select.cop_tekoaly_tila
        name: Tila
      - type: buttons
        entities:
          - entity: button.cop_tekoaly_hyvaksy_ehdotus
            name: Hyväksy
            icon: mdi:check-circle-outline
          - entity: button.cop_tekoaly_hylkaa_ehdotus
            name: Hylkää
            icon: mdi:close-circle-outline
          - entity: button.cop_tekoaly_palauta_alkuperaiset
            name: Palauta
            icon: mdi:restore

  # --- Käynnissä oleva toimenpide tai ehdotus -------------------------------------------------
  - type: markdown
    card_mod:
      style: |
        ha-card { font-family: "Roboto Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; }
    content: |
      {%- set st = 'sensor.cop_tekoaly_tilanne' -%}
      {%- set a = state_attr(st, 'toimenpide') -%}
      {%- set p = state_attr(st, 'ehdotus') -%}
      {%- set types = {'min_od_down': 'Min OD ↓ (kuivatus)', 'sv_up': 'Sv ↑ (kuivatus)',
                       'min_od_up': 'Min OD ↑ (vakautus)', 'sv_down': 'Sv ↓ (tehostus)'} -%}
      {%- set phases = {'probe_write': 'kirjoittaa kokeilun', 'probe_wait': 'odottaa ohjaimen reaktiota',
                        'probe_revert': 'palauttaa kokeilun', 'apply_write': 'kirjoittaa',
                        'verify': 'varmistaa vaikutusta', 'revert': 'peruu muutoksen'} -%}
      ### Toimenpide
      {% if a -%}
      | | |
      |:--|:--|
      | tyyppi | {{ types.get(a.tyyppi, a.tyyppi) }} |
      | vaihe | {{ phases.get(a.vaihe, a.vaihe) }} |
      | parametri | {{ (a.parametri or '–') | replace('EEV Set|', '') }} |
      | kokeilujärjestys | {{ a.ehdokkaat | join(', ') }} (kokeiltu {{ a.testattu }}) |
      | varmistus | {{ a.varmistus_min }} tasaista min |

      {{ a.syy }}
      {%- elif p -%}
      <ha-alert alert-type="info">Ehdotus odottaa: {{ p.otsikko }}</ha-alert>

      {{ p.syy }}
      {%- elif state_attr(st, 'hyväksytty_odottaa') -%}
      Hyväksytty, odottaa samaa tilannetta: {{ state_attr(st, 'hyväksytty_odottaa') }}
      {%- elif state_attr(st, 'tekisi') -%}
      Tekisi nyt: **{{ state_attr(st, 'tekisi') }}**
      {%- else -%}
      Ei toimenpidettä.
      {%- endif %}

  # --- EEV:n vyöhyketaulukko: nykyarvot, tekoälyn muutokset ja opitut vyöhykkeet ---------------
  - type: markdown
    card_mod:
      style: |
        ha-card { font-family: "Roboto Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; }
    content: |
      {%- set st = 'sensor.cop_tekoaly_tilanne' -%}
      {%- set changed = state_attr(st, 'muutetut_arvot') or {} -%}
      {%- set zones = state_attr(st, 'opitut_vyöhykkeet') or [] -%}
      {%- set lims = state_attr(st, 'alarajat') or {} -%}
      {%- set nums = states.number | list -%}
      {%- macro raw(pat) -%}
        {%- set e = nums | selectattr('entity_id', 'search', pat ~ '_raw$') | list -%}
        {{- e[0].state | int(none) if e and e[0].state not in ['unknown', 'unavailable'] else none -}}
      {%- endmacro -%}
      {%- set maxstep = raw('mortor_set_m_eev_max_step') | int(500) -%}
      {%- set k = maxstep / 100 -%}
      {%- set eev = states('sensor.eev_main_opening') | float(none) -%}
      ### EEV-vyöhykkeet · EEV {{ eev | int(0) if eev is not none else '–' }} askelta ({{ (((eev or 0) / k) | round(1)) | string | replace('.', ',') }} %)
      | Z | Min OD | Sv (K) | opittu ulko | huom |
      |:-:|--:|--:|:--|:--|
      {% for i in range(1, 10) -%}
      {%- set od = raw('eev_set_heat_min_od' ~ i) | int(none) -%}
      {%- set sv = raw('eev_set_heat_sv' ~ i) | int(none) -%}
      {%- set k1 = 'Heat Min OD' ~ i -%}
      {%- set k2 = 'Heat Sv' ~ i -%}
      {%- set temps = zones | selectattr('parametri', 'in', [k1, k2]) | map(attribute='ulko') | select('number') | list -%}
      {%- set notes = namespace(t=[]) -%}
      {%- if k1 in changed -%}{%- set notes.t = notes.t + ['OD ' ~ changed[k1]['alkuperäinen'] ~ '→' ~ changed[k1]['nyt']] -%}{%- endif -%}
      {%- if k2 in changed -%}{%- set notes.t = notes.t + ['Sv ' ~ changed[k2]['alkuperäinen'] ~ '→' ~ changed[k2]['nyt']] -%}{%- endif -%}
      {%- if k1 in lims -%}{%- set notes.t = notes.t + ['alaraja ' ~ lims[k1]] -%}{%- endif -%}
      {%- if eev is not none and od is not none and (eev - od * k) | abs <= 2.5 -%}{%- set notes.t = notes.t + ['◀ EEV lattialla'] -%}{%- endif -%}
      {%- set lo = (temps | min | round(1)) if temps else none -%}
      {%- set hi = (temps | max | round(1)) if temps else none -%}
      {%- set span = '' if lo is none else ((lo ~ ' °C') if lo == hi else (lo ~ '…' ~ hi ~ ' °C')) -%}
      | {{ i }} | {{ od if od is not none else '–' }} | {{ ((sv / 10) | round(1)) | string | replace('.', ',') if sv is not none else '–' }} | {{ span | replace('.', ',') }} | {{ notes.t | join(', ') }} |
      {% endfor %}

  # --- Kylmäpiiri nyt -----------------------------------------------------------------------
  - type: markdown
    card_mod:
      style: |
        ha-card { font-family: "Roboto Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; }
    content: |
      {%- macro v(e, d=1) -%}{{ ((states(e) | float) | round(d)) | string | replace('.', ',') if states(e) | is_number else '–' }}{%- endmacro -%}
      {%- set te = states('sensor.kylmaaine_haihdutuksen_kyllastyslampo_evap_sat') | float(none) -%}
      {%- set tc = states('sensor.kylmaaine_lauhdutuksen_kyllastyslampo_cond_sat') | float(none) -%}
      ### Kylmäpiiri nyt
      | | | | |
      |:--|--:|:--|--:|
      | Te höyrystyminen | {{ v('sensor.kylmaaine_haihdutuksen_kyllastyslampo_evap_sat') }} °C | Tc lauhtuminen | {{ v('sensor.kylmaaine_lauhdutuksen_kyllastyslampo_cond_sat') }} °C |
      | nosto Tc−Te | {{ ((tc - te) | round(1)) | string | replace('.', ',') if te is not none and tc is not none else '–' }} K | paineet | {{ v('sensor.kylmaaine_paine_low') }} / {{ v('sensor.kylmaaine_paine_high') }} bar |
      | imukaasu | {{ v('sensor.kylmaaine_imukaasu_suction') }} °C | tulistus SH | {{ v('sensor.hp_superheat') }} K |
      | kuumakaasu | {{ v('sensor.kylmaaine_puristuskaasu_discharge') }} °C | DSH | {{ v('sensor.hp_discharge_superheat') }} K |
      | SH ohjain | {{ v('sensor.hp_main_eev_superheat_actual') }} K | SH tavoite | {{ v('sensor.hp_subcool_superheat_controller') }} K |
      | kompressori | {{ v('sensor.hp_running_speed') }} rps | INVT | {{ v('sensor.invt_pout_power', 2) }} kW |
      | ulko | {{ v('sensor.ouman_outdoor_temperature') }} °C | meno / paluu | {{ v('sensor.lampopumppu_menovesi') }} / {{ v('sensor.lampopumppu_paluuvesi') }} °C |

  # --- Käyrät ---------------------------------------------------------------------------------
  - type: history-graph
    title: Märkyys
    hours_to_show: 24
    entities:
      - entity: sensor.cop_tekoaly_naennainen_hyotysuhde
        name: Näennäinen hyötysuhde
      - entity: sensor.hp_discharge_superheat
        name: DSH
  - type: history-graph
    title: EEV ja tulistus
    hours_to_show: 24
    entities:
      - entity: sensor.eev_main_opening
        name: EEV-askeleet
      - entity: sensor.hp_main_eev_superheat_actual
        name: SH oloarvo
      - entity: sensor.hp_subcool_superheat_controller
        name: SH tavoite
  - type: history-graph
    title: COP
    hours_to_show: 48
    entities:
      - entity: sensor.cop_tekoaly_cop
        name: COP (tunti)
      - entity: sensor.cop_tekoaly_cop_laatuaste
        name: Laatuaste
      - entity: sensor.cop_tekoaly_cop_poikkeama
        name: Poikkeama opitusta
  - type: statistics-graph
    title: 7 vrk tuntikeskiarvot
    period: hour
    days_to_show: 7
    chart_type: line
    stat_types:
      - mean
    entities:
      - entity: sensor.cop_tekoaly_naennainen_hyotysuhde
        name: Näennäinen hyötysuhde
      - entity: sensor.cop_tekoaly_cop_laatuaste
        name: COP-laatuaste

  # --- Päätöshistoria -------------------------------------------------------------------------
  - type: markdown
    card_mod:
      style: |
        ha-card { font-family: "Roboto Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; }
    content: |
      {%- set h = state_attr('sensor.cop_tekoaly_tilanne', 'historia') or [] -%}
      {%- set types = {'min_od_down': 'OD ↓', 'sv_up': 'Sv ↑', 'min_od_up': 'OD ↑', 'sv_down': 'Sv ↓'} -%}
      {%- set res = {'hyväksytty': '<font color="#3fb950">voimaan</font>', 'ei_hyotya': '<font color="#d29922">ei hyötyä, peruttu</font>',
                     'haitta': '<font color="#e5534b">haitta, peruttu</font>', 'keskeytetty': 'keskeytetty',
                     'ei_tunnistettu': 'vyöhykettä ei löytynyt', 'ei_varmistettu': 'ei varmistettu, peruttu'} -%}
      ### Päätökset
      {% if h -%}
      | aika | | parametri | arvo | tulos |
      |:--|:-:|:--|:--|:--|
      {% for e in h | reverse -%}
      | {{ as_timestamp(e.t) | timestamp_custom('%d.%m. %H:%M') }} | {{ types.get(e.type, e.type) }} | {{ e.key or '–' }} | {{ e['from'] }} → {{ e['to'] }} | {{ res.get(e.outcome, e.outcome) }} |
      {% endfor -%}
      {%- else -%}
      Ei vielä päätöksiä. Tarkkailutilassa suunnitelmat näkyvät lokikirjassa ("Tekisin: …").
      {%- endif %}
  - type: logbook
    title: Lokikirja
    hours_to_show: 48
    target:
      entity_id: sensor.cop_tekoaly_tilanne
